post_limit: 10

base:
  url: lucianofedericopereira.github.io
  folder: codecraft

meta:
  title: design﹢code
  tagline: CodeCraft Chronicles
  author: Luciano Pereira
  repository: https://github.com/lucianofedericopereira
  license: GPLv2
  locale: en

assets:
  images:
    logo: codeCraft.ico
    favicon: codeCraft.ico
  fonts:
    - type: title
      name: Mediaan
      weight: Regular
      extension: woff2
    - type: body
      name: VisueltPro
      weight: Regular
      extension: woff2
    - type: code
      name: JetBrainsMono
      weight: Medium
      extension: woff2

texture:
  seed: 42
  ink: "#453E35"
  light: "#FFFFF8"
  fibres: 320
  fibre_opacity: 0.18
  grain_opacity: 0.35

links:
  LinkedIn: https://www.linkedin.com/in/lucianofedericopereira/
  GitHub: https://github.com/lucianofedericopereira

sections:
  - design
  - code
  - projects

tags:
  - linux

rules:
  - scope:
      path: themes/sections/home.md
    features:
      banner: false
      toc: false
      comments: false
      mermaid: false
      codepen: false
  - scope:
      path: themes/sections
    features:
      banner: true
      toc: false
      comments: false
      mermaid: false
      codepen: false
  - scope:
      path: content
    features:
      toc: true
      comments: false
      mermaid: false
      codepen: false

comments:
  theme: github-light
  issue: title
  repo: lucianofedericopereira/comments
  src: https://utteranc.es/client.js

scripts:
  mermaid: 12.1.0
