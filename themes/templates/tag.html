{% if intro %}<p>{{ intro }}</p>
{% endif %}{% set ns = namespace(current_year='') %}
{% for item in tag.posts %}
{% set year = item.date|year %}
{% if year != ns.current_year %}
<h3>{{ year }}</h3>
{% set ns.current_year = year %}
{% endif %}
<p class="list"><a href="{{ item.url }}"><span>{{ item.date|date_archive }}</span> {{ item.title }}</a></p>
{% endfor %}
