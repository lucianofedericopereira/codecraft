name: Update README

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "readme"
  cancel-in-progress: true

jobs:
  readme:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Release numbers
      uses: lucianofedericopereira/sigilmd@v0.2.1
      with:
        config: .github/readme.toml
        commit: 'false'

    - name: Badges
      uses: lucianofedericopereira/sigilbadges@v0.2.1
      with:
        commit: 'false'

    - name: Project tree
      uses: lucianofedericopereira/treegen2@v0.2.0
      with:
        commit: 'false'

    - name: Commit changes
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add README.md assets
        if git diff --cached --quiet; then
          echo "README is up to date"
          exit 0
        fi
        git commit -m "docs: update README [skip ci]"
        git push
